# Perfil usado pelos testes de integracao: banco H2 em memoria, sem
# depender de Docker/MySQL para rodar "mvn test".
spring.datasource.url=jdbc:h2:mem:gestao-academico-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=NuEDTlWWH/WitmbS7jdO2NiU0LICTGhNTY2rcqjq0adAzCS6kBRBgrkCmwXK+nReqh+Y9stgKEcHCnbZ3H213w==
jwt.expiration=86400000

cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Cache-Control,Content-Type
